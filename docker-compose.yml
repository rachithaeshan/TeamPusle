version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: weekly_reports_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: weekly_reports_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - weekly_reports_pgdata:/var/lib/postgresql/data

volumes:
  weekly_reports_pgdata:
