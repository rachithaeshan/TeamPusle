server:
  port: 8081

spring:
  application:
    name: weekly-report-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/weekly_reports_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:rachitha123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'update' is convenient for dev; use a migration tool (Flyway/Liquibase) in production
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-to-something-long-and-random-in-prod}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    com.weeklyreports: INFO
    org.springframework.security: WARN
