server:
  port: 8081

spring:
  application:
    name: weekly-report-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/weekly_reports_db?preferQueryMode=simple
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:rachitha123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  jackson:
    default-property-inclusion: non_null

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:/db/migration
    validate-on-migrate: false

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-to-something-long-and-random-in-prod}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  model: ${GEMINI_MODEL:gemini-2.5-flash}

logging:
  level:
    com.weeklyreports: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO

# Expose actuator endpoints (health, info) on the web
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never


